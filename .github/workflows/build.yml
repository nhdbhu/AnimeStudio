name: Build

on:
  push:
    branches:
      - 'master'
      - 'genshin-linux-cli'
    paths-ignore:
      - '**/LICENSE'
      - '**/README.md'
      - '**/.gitignore'
      - '**/.gitattributes'
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v3
      - uses: microsoft/setup-msbuild@v1.1
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Nuget Restore
        run: nuget restore

      #############
      ### BUILD ###
      #############

      - name: Build Studio
        shell: pwsh
        run: .\build.ps1

      - name: Prepare Artifacts
        run: |
          mkdir output-net9\\AnimeStudio-net9-${{ github.sha }}
          xcopy /E /I /Y .\dist\net9.0-windows\* output-net9\\AnimeStudio-net9-${{ github.sha }}\\
          mkdir output-net10\\AnimeStudio-net10-${{ github.sha }}
          xcopy /E /I /Y .\dist\net10.0-windows\* output-net10\\AnimeStudio-net10-${{ github.sha }}\\

      - name: Upload .NET 9 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnimeStudio-net9
          path: output-net9

      - name: Upload .NET 10 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnimeStudio-net10
          path: output-net10

  linux-cli:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Build native Ooz for Linux
        run: |
          cmake -S AnimeStudio.Ooz -B build-ooz \
            -DCMAKE_BUILD_TYPE=Release \
            -DOOZ_BUILD_BUN=OFF \
            -DOOZ_BUILD_EXE=OFF \
            -DOOZ_BUILD_VALIDATE=OFF
          cmake --build build-ooz --config Release --parallel

      - name: Verify native Ooz
        run: |
          file build-ooz/libAnimeStudio.Ooz.dll.so
          nm -D build-ooz/libAnimeStudio.Ooz.dll.so | grep ' Ooz_Decompress$'

      - name: Restore Linux CLI
        run: dotnet restore AnimeStudio.CLI/AnimeStudio.CLI.csproj

      - name: Publish Linux CLI (.NET 9)
        run: >-
          dotnet publish AnimeStudio.CLI/AnimeStudio.CLI.csproj
          -c Release
          -f net9.0
          -r linux-x64
          --self-contained true
          -o dist/linux-x64/net9.0

      - name: Publish Linux CLI (.NET 10)
        run: >-
          dotnet publish AnimeStudio.CLI/AnimeStudio.CLI.csproj
          -c Release
          -f net10.0
          -r linux-x64
          --self-contained true
          -o dist/linux-x64/net10.0

      - name: Package native Ooz into Linux CLI artifacts
        run: |
          cp build-ooz/libAnimeStudio.Ooz.dll.so dist/linux-x64/net9.0/
          cp build-ooz/libAnimeStudio.Ooz.dll.so dist/linux-x64/net10.0/

      - name: Verify packaged native Ooz
        run: |
          file dist/linux-x64/net9.0/libAnimeStudio.Ooz.dll.so
          file dist/linux-x64/net10.0/libAnimeStudio.Ooz.dll.so

      - name: Smoke-test Linux CLI (.NET 9)
        run: ./dist/linux-x64/net9.0/AnimeStudio.CLI --help

      - name: Smoke-test Linux CLI (.NET 10)
        run: ./dist/linux-x64/net10.0/AnimeStudio.CLI --help

      - name: Upload Linux CLI (.NET 9)
        uses: actions/upload-artifact@v4
        with:
          name: AnimeStudio-CLI-linux-x64-net9
          path: dist/linux-x64/net9.0

      - name: Upload Linux CLI (.NET 10)
        uses: actions/upload-artifact@v4
        with:
          name: AnimeStudio-CLI-linux-x64-net10
          path: dist/linux-x64/net10.0
